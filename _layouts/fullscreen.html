---
layout: default
---

<style>
#up-to-top {
	display: none;
}
.top-bar.filler {
	display: none;
}
</style>

{% if page.hide_footer %}

<div class="f-topbar-fixed" style="position: absolute; left:0; top:0; width:100%; height:100%;">
	{{ content }}
</div>

{% else %}

<div style="position: relative; left:0; top:0; width:100%; height:100%;">
	{{ content }}
</div>

{% endif %}
